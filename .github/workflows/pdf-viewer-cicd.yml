# PDF-VIEWER (alliance-ibd-pdf-viewer, branch main): CI on GitHub Actions, deploy on Jenkins (CD-only job pdf-viewer-cd).
#
#   GitHub Actions (build + image by digest)  ->  pdf-viewer-cd (Jenkins: verify + Lambda image update)  ->  AWS Lambda
#
# Why (owner decision, 2026-11-12): the legacy job pdf-viewer (devops PIPES/MICROSERVICES/pdf-viewer/dev-v3/Jenkinsfile)
# runs `docker build` on the Jenkins agent. The build moves here (Docker runs on the GitHub runner); Jenkins keeps the
# legacy Lambda update (`aws lambda update-function-code --image-uri` + `aws lambda wait function-updated`, same function,
# region and credential) with the image referenced by its verified digest, and no longer needs Docker. The legacy job is
# not changed and stays available in Jenkins for manual recovery (jenkins-trigger.yml, workflow_dispatch only).
#
# Build (the legacy stages Install Dependencies, Build, Package and the docker part of Deploy to Lambda, unchanged):
#   npm ci (npm install when the lock file is out of sync, as the legacy job), `npm run build` (Next.js standalone),
#   `npm run package:lambda`, then the ORIGINAL Dockerfile (`docker build .`) without AWS credentials. The legacy AUTO
#   mode always resolved to the container image in practice (the function's package type is Image), so the image is
#   always built. No secret is needed: the function's environment variables are set on the Lambda, not by the pipeline.
# The job names are part of the Jenkins contract (stage "Verify CI Run"): `CI script checks (bash -n, ShellCheck)` and
# `publish image (pdf-viewer)`. Rename them only together with the Jenkinsfile.
#
# Slack (Reporting Tool format, title PDF-VIEWER NEW ENVIRONMENT, label PROD as the legacy messages):
#   started     this workflow, at the start of the run (no `needs`)
#   failed      this workflow, when the run failed BEFORE Jenkins accepted the request
#   succeeded / failed (deploy)   Jenkins pdf-viewer-cd
#
# GitHub Environment pdf-viewer-prod (publish and hand-over): deployment branch main only; administrators cannot bypass.
#   Variables: CICD_BOUND_REF (refs/heads/main), CICD_AWS_REGION, CICD_ECR_REPOSITORY (alliance-ibd-pdf-viewer).
#   Secret: CICD_BUILD_ROLE_ARN (an identifier, kept as a secret only so GitHub masks it in these public logs).
#   The build role trusts only this repository (repository and owner ids), the environment pdf-viewer-prod and the ref
#   refs/heads/main; it can only push to alliance-ibd-pdf-viewer (no Lambda permission: the deploy stays in Jenkins).
#   Repository secrets JENKINS_USERNAME / JENKINS_API_TOKEN (the same as jenkins-trigger.yml).
#
# Action pinning: every `uses:` is a full commit SHA (same SHAs as the other migrated pipelines):
#   actions/checkout                       v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-node                     v7.0.0  820762786026740c76f36085b0efc47a31fe5020
#   aws-actions/configure-aws-credentials  v6.3.0  e1253824e5c10ff9df46874f81ed3ec929e19cfd
name: pdf-viewer-cicd

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pdf-viewer-cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- start notification
  notify-start:
    name: notify start (Slack)
    permissions: {}
    uses: ./.github/workflows/slack-notify.reusable.yml
    with:
      status: started
      title: PDF-VIEWER NEW ENVIRONMENT
      project: PDF-VIEWER
      environment-label: PROD
    secrets:
      SLACK_NOTIFICATIONS_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFICATIONS_WEBHOOK_URL }}

  # ---------------------------------------------------------------- mandatory checks
  # The legacy job runs no lint and no tests (none added). Only the CI scripts are checked.
  ci-script-checks:
    name: CI script checks (bash -n, ShellCheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax
        run: |
          for f in .github/scripts/*.sh; do bash -n "$f"; done
      - name: ShellCheck (preinstalled on the runner)
        run: shellcheck --severity=warning .github/scripts/*.sh

  # ---------------------------------------------------------------- build + publish
  publish-image:
    name: publish image (pdf-viewer)
    needs: ci-script-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: pdf-viewer-prod
    permissions:
      id-token: write
      contents: read
    env:
      DOCKER_BUILDKIT: '1'
      LOCAL_IMAGE: local/pdf-viewer:${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Enforce bound ref
        env:
          BOUND_REF: ${{ vars.CICD_BOUND_REF }}
          CURRENT_REF: ${{ github.ref }}
        run: |
          if [ -z "${BOUND_REF:-}" ] || [ "$CURRENT_REF" != "$BOUND_REF" ]; then echo "::error::ref is not the bound ref (fail closed)"; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22' # legacy tool "Node 22"
      - name: Install dependencies (legacy stage "Install Dependencies")
        run: |
          if [ -f package-lock.json ]; then
            if npm ci; then echo "npm ci succeeded"; else echo "npm ci failed (lock file out of sync), falling back to npm install"; npm install; fi
          else
            npm install
          fi
      - name: Build (legacy stage "Build")
        run: npm run build
      - name: Package (legacy stage "Package")
        run: npm run package:lambda
      # Original Dockerfile and build context, as `docker build -t alliance-ibd-pdf-viewer:<n> .` in the legacy job; only
      # the provenance labels checked by Jenkins (stage "Verify Image") are added.
      - name: Build image (original Dockerfile)
        run: >-
          bash .github/scripts/without-oidc.sh docker build
          --label "org.opencontainers.image.revision=${{ github.sha }}"
          --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
          --label "org.cgiar.cicd.run=${{ github.run_id }}-${{ github.run_attempt }}"
          --label org.cgiar.cicd.unit=pdf-viewer
          --tag "$LOCAL_IMAGE" .
      - name: Assume the build role through OIDC (credentials not exported to the job)
        id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.CICD_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.CICD_AWS_REGION }}
          role-session-name: pdf-viewer-ci-${{ github.run_id }}
          mask-aws-account-id: true
          output-env-credentials: false
          output-credentials: true
      - name: Push image and capture its digest
        id: push
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
          AWS_REGION: ${{ vars.CICD_AWS_REGION }}
          REPOSITORY: ${{ vars.CICD_ECR_REPOSITORY }}
          LOCAL: ${{ env.LOCAL_IMAGE }}
          TAG: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash .github/scripts/push-image.sh

  # ---------------------------------------------------------------- CD hand-over to Jenkins
  deploy:
    name: deploy (Jenkins pdf-viewer-cd)
    needs: publish-image
    if: needs.publish-image.result == 'success' && needs.publish-image.outputs.digest != ''
    permissions: {}
    uses: ./.github/workflows/jenkins-cd.reusable.yml
    with:
      jenkins-job: pdf-viewer-cd
      environment: pdf-viewer-prod
      dry-run: false # real deploy from the first run on main (as the other migrated pipelines); true = validation only
      artifacts: pdf-viewer=${{ needs.publish-image.outputs.digest }}
    secrets:
      JENKINS_USERNAME: ${{ secrets.JENKINS_USERNAME }}
      JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}

  # ---------------------------------------------------------------- CI failure notification
  notify-ci-failure:
    name: notify CI failure (Slack)
    needs: [ci-script-checks, publish-image, deploy]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    permissions: {}
    uses: ./.github/workflows/slack-notify.reusable.yml
    with:
      status: failed
      title: PDF-VIEWER NEW ENVIRONMENT
      project: PDF-VIEWER
      environment-label: PROD
      detail: >-
        ci-script-checks=${{ needs.ci-script-checks.result }},
        publish-image=${{ needs.publish-image.result }},
        jenkins-hand-over=${{ needs.deploy.result }}
    secrets:
      SLACK_NOTIFICATIONS_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFICATIONS_WEBHOOK_URL }}
